name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      CUDA_VISIBLE_DEVICES: ''
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m compileall -q src tests scripts
      - run: python -m sac_qutab validate-config --config configs/core.yaml --campaign configs/sac-campaign-v1.yaml --world-size 1
      - run: python -m pytest -q -p no:cacheprovider
      - name: Package integrity (available after packaging PR)
        run: |
          if [ -f scripts/check_submission.py ]; then python scripts/check_submission.py; fi
          if [ -f docs/release-manifest.json ]; then python scripts/check_submission.py --complete; fi
